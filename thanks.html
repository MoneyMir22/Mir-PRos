<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanks | MIR Pros</title><meta name="robots" content="noindex"><link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: gilded wordmark hero, three service columns, a four-step process, contact panel. Dark-first, ivory light mode. */
:root{
  --bg:#0f0d0a; --surface:#18150f; --line:#2e281c;
  --fg:#f1ead9; --muted:#a89c84;
  --gold:#d4a64a; --gold-hi:#f3d58a; --gold-lo:#8f6a24;
  --on-gold:#1a1408;
  --f-mark:"Cinzel","Trajan Pro",Georgia,serif;
  --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f8f4ea; --surface:#fffdf7; --line:#e4d9c0;
  --fg:#1d1910; --muted:#6b604a;
  --gold:#a87a22; --gold-hi:#c99a3c; --gold-lo:#7a5612; --on-gold:#fffaf0;
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f8f4ea; --surface:#fffdf7; --line:#e4d9c0;
  --fg:#1d1910; --muted:#6b604a;
  --gold:#a87a22; --gold-hi:#c99a3c; --gold-lo:#7a5612; --on-gold:#fffaf0;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* nav */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.brand{font-family:var(--f-mark);font-weight:700;font-size:22px;letter-spacing:.08em;text-decoration:none;color:var(--gold)}
.brand small{font-family:var(--f-body);font-weight:600;font-size:11px;letter-spacing:.22em;color:var(--muted);margin-left:8px}
.links{display:flex;gap:24px;font-size:14px;font-weight:500}
.links a{text-decoration:none;color:var(--muted)}
.links a:hover{color:var(--fg)}
@media (max-width:640px){.links a:not(.cta-link){display:none}}
.cta-link{color:var(--gold)!important}

/* hero */
.hero{text-align:center;padding-block:clamp(56px,10vw,110px) clamp(48px,8vw,90px)}
.logo{display:block;width:min(680px,100%);height:auto;margin:0 auto}
.hero h1{font-family:var(--f-display);font-weight:500;font-size:clamp(32px,5vw,54px);line-height:1.12;max-width:20ch;margin:44px auto 0;text-wrap:balance}
.hero h1 em{color:var(--gold);font-style:italic}
.hero p{max-width:58ch;margin:20px auto 0;color:var(--muted)}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:32px}
.btn{display:inline-block;padding:14px 26px;border-radius:2px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid var(--gold);cursor:pointer;font-family:var(--f-body)}
.btn.primary{background:var(--gold);color:var(--on-gold)}
.btn.primary:hover{background:var(--gold-hi)}
.btn.ghost{color:var(--gold);background:transparent}
.btn.ghost:hover{background:color-mix(in srgb,var(--gold) 12%,transparent)}

/* sections */
section{padding-block:clamp(56px,8vw,96px);border-top:1px solid var(--line)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:0}
h2{font-family:var(--f-display);font-weight:500;font-size:clamp(30px,4.2vw,46px);line-height:1.15;margin:10px 0 0;max-width:22ch;text-wrap:balance}
.lede{color:var(--muted);max-width:60ch;margin:16px 0 0}

/* pillars: the three letters */
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:48px;border:1px solid var(--line)}
.pillar{padding:32px 28px;min-width:0;border-right:1px solid var(--line);background:var(--surface)}
.pillar:last-child{border-right:0}
.pillar .letter{font-family:var(--f-mark);font-size:56px;line-height:1;color:var(--gold)}
.pillar h3{font-family:var(--f-display);font-size:28px;font-weight:600;margin:14px 0 8px}
.pillar p{color:var(--muted);margin:0 0 16px;font-size:16px}
.pillar ul{list-style:none;padding:0;margin:0;display:grid;gap:8px;font-size:15px}
.pillar li{padding-left:18px;position:relative}
.pillar li::before{content:"";position:absolute;left:0;top:.7em;width:8px;height:1px;background:var(--gold)}
@media (max-width:820px){.pillars{grid-template-columns:1fr}.pillar{border-right:0;border-bottom:1px solid var(--line)}.pillar:last-child{border-bottom:0}}

/* AI band */
.ai{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center}
.ai > *{min-width:0}
.feed{background:var(--surface);border:1px solid var(--line);padding:22px;font-size:14px;display:grid;gap:12px}
.feed .row{display:flex;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.feed .row:last-child{border-bottom:0;padding-bottom:0}
.feed .k{color:var(--muted)}
.feed .v{font-weight:600;text-align:right}
.chip{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--gold);color:var(--gold);border-radius:2px;white-space:nowrap}
.feed-note{font-size:12px;color:var(--muted);margin:10px 0 0}
@media (max-width:820px){.ai{grid-template-columns:1fr}}

/* process */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;margin-top:48px;counter-reset:s}
.step{min-width:0;border-top:1px solid var(--gold);padding-top:18px}
.step .n{font-family:var(--f-mark);color:var(--gold);font-size:14px;letter-spacing:.2em}
.step h3{font-family:var(--f-display);font-size:26px;font-weight:600;margin:6px 0 6px}
.step p{margin:0;color:var(--muted);font-size:15px}
@media (max-width:900px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}

/* who */
.who{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.who span{border:1px solid var(--line);padding:8px 14px;font-size:14px;background:var(--surface)}

/* contact */
.contact{display:grid;grid-template-columns:1fr 1.1fr;gap:48px}
.contact > *{min-width:0}
form{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);padding:28px}
label{font-size:13px;font-weight:600;letter-spacing:.04em;display:grid;gap:6px}
input,select,textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);padding:12px;border-radius:2px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ok{color:var(--gold);font-weight:600;margin:0}
@media (max-width:820px){.contact{grid-template-columns:1fr}}
@media (max-width:480px){.two{grid-template-columns:1fr}}
.domain{font-family:var(--f-mark);font-size:22px;letter-spacing:.06em;color:var(--gold);margin-top:22px}

footer{border-top:1px solid var(--line);padding-block:28px;font-size:13px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

</style>
</head><body>
<main class="wrap hero">
<img class="logo" src="mir-logo.webp" width="1023" height="454" alt="MIR — Media Influenced Relations">
<h1>Thanks. <em>We got your request.</em></h1>
<p>A member of the MIR Pros team will reach out within one business day to set up your strategy call. Want to skip the wait? Grab a time now.</p>
<div class="btns"><a class="btn primary" href="https://calendly.com/amir-mirpros/new-meeting" target="_blank" rel="noopener">Book my call now</a> <a class="btn ghost" href="/">Back to mirpros.com</a></div>
</main>
</body></html>
